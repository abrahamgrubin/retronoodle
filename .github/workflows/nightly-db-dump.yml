name: Nightly DB dump

# RN-027: "nightly compressed DB dump." Stored as a workflow artifact (free within GitHub's
# included quota at this project's size) rather than a second cloud storage account — "under
# $10/month" and "deferred: staging" both argue against adding infra for this.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump and compress
        # Bug found live (first fix): without pipefail, `pg_dump ... | gzip > file` only reported
        # *gzip's* exit code — pg_dump failing (e.g. an empty/wrong PRODUCTION_DATABASE_URL) still
        # let the step, and the whole run, show green while silently uploading a useless artifact.
        #
        # Bug found live (second fix): ubuntu-latest ships its own pg_dump (16.x), which refuses to
        # dump a newer Postgres server (Supabase runs 17.x) — "aborting because of server version
        # mismatch". The Supabase CLI bundles its own pg_dump that always matches the server, so use
        # `supabase db dump` instead of apt's postgresql-client.
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set"
            exit 1
          fi
          supabase db dump --db-url "${{ secrets.PRODUCTION_DATABASE_URL }}" -f "retronoodle-$(date -u +%F).sql"
          gzip "retronoodle-$(date -u +%F).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: retronoodle-db-dump-${{ github.run_id }}
          path: retronoodle-*.sql.gz
          retention-days: 14

name: Deploy

# RN-027: "A merge to main deploys both apps with migrations applied first." Separate from ci.yml
# deliberately — by the time a push lands on main, the PR that put it there already passed CI
# (branch protection), so this workflow's only job is shipping it, not re-verifying it.
#
# The web app is NOT deployed here. Cloudflare moved new projects from Pages to Workers' own
# static-assets hosting, which runs its own Git-integrated CI ("Workers Builds") straight from
# GitHub pushes — see apps/web/wrangler.jsonc. That's a deliberate choice, not a gap: the one
# real tradeoff is the web deploy no longer strictly waits for this workflow's own migration
# step, which is an acceptable risk for a single-user portfolio site (worst case, a few seconds
# of API errors right after a push) rather than fighting two separate deploy mechanisms.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   PRODUCTION_DATABASE_URL   — Postgres connection string (Supabase Project Settings > Database).
#                               Use the Session pooler string (port 5432 on the pooler hostname),
#                               not Direct connection (IPv6-only, often unreachable) or Transaction
#                               pooler (port 6543 — breaks pg-boss's session-level features).
#   RENDER_DEPLOY_HOOK_URL    — Render service > Settings > Deploy Hook
# Cloudflare's own env vars (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_API_URL) are
# configured on its own project, not here — see wrangler.jsonc's own comment. The Render service
# itself is created once by hand — this workflow only ever pushes to it.
on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `db push` tracks which migrations already ran against this exact database (its own
      # schema_migrations table) and applies only what's new, in order — safe to run on every
      # deploy even when nothing changed.
      - run: supabase db push --db-url "${{ secrets.PRODUCTION_DATABASE_URL }}"

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

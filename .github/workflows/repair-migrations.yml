name: One-off migration history repair

# Production's schema already has these 7 migrations applied (same drift as PR #40's
# repair-migrations.yml, back on 2026-10-06 — see that commit's own message), but the CLI's own
# migration-history table never recorded it, so `supabase db push` has been failing since PR #54
# (2026-10-11). The first 6 were already live before this repair was written; 20261017090000 was
# confirmed live too on the very next db push attempt after this file's first run — turns out
# PRODUCTION_DATABASE_URL and dev's own DATABASE_URL point at the same project, so the column had
# already been added directly (psql) while fixing this same migration locally. This marks all 7
# as already applied without re-running their SQL, so the next db push has nothing left to do but
# actually succeed. Manual-only, single use — delete after running once, same as last time.
on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase migration repair --status applied \
            20261012090000 20261014090000 20261014100000 \
            20261015120000 20261016090000 20261016120000 \
            20261017090000 \
            --db-url "${{ secrets.PRODUCTION_DATABASE_URL }}"

name: One-off migration history repair

# Production's schema already has these 6 migrations applied (same drift as PR #40's
# repair-migrations.yml, back on 2026-10-06 — see that commit's own message), but the CLI's own
# migration-history table never recorded it, so `supabase db push` has been failing on the first
# of them (20261012090000_transcription.sql, "column already exists") on every deploy since PR
# #54 (2026-10-11). This marks all 6 as already applied without re-running their SQL, so the next
# db push only has to apply what's genuinely new (20261017090000_recap_additional_notes.sql).
# Manual-only, single use — delete after running once, same as last time.
on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase migration repair --status applied \
            20261012090000 20261014090000 20261014100000 \
            20261015120000 20261016090000 20261016120000 \
            --db-url "${{ secrets.PRODUCTION_DATABASE_URL }}"

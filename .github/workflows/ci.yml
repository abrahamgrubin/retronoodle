name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: ./supabase/tests/schema-checks.sh postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Export local Supabase credentials (RN-004/RN-008 integration tests)
        run: |
          supabase status -o env
          # `-o env` quotes its values (KEY="value"), but $GITHUB_ENV takes everything after
          # `=` literally, so the quotes must be stripped or they end up in the value.
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed \
            -e 's/^API_URL="\(.*\)"$/SUPABASE_URL=\1/' \
            -e 's/^ANON_KEY="\(.*\)"$/SUPABASE_ANON_KEY=\1/' \
            -e 's/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/' \
            -e 's/^DB_URL="\(.*\)"$/DATABASE_URL=\1/' >> "$GITHUB_ENV"
          # The web dev server (started below, by Playwright's webServer) only reads VITE_-
          # prefixed vars — same values, just aliased for Vite's client-side env exposure.
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed \
            -e 's/^API_URL="\(.*\)"$/VITE_SUPABASE_URL=\1/' \
            -e 's/^ANON_KEY="\(.*\)"$/VITE_SUPABASE_ANON_KEY=\1/' >> "$GITHUB_ENV"
          echo "VITE_API_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - run: pnpm --filter @retronoodle/api exec vitest run src/realtime/RealtimeBus.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/pipeline.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/routes/board.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/phaseTransition.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/realtime/hiddenCards.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/phaseTimer.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/cardMove.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/topics.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/reactionToggle.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/suggestions.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/votes.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/discussQueue.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/noteUpsert.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/topicSummary.integration.test.ts
      - run: pnpm --filter @retronoodle/api exec vitest run src/mutations/actionItem.integration.test.ts
      - run: pnpm --filter @retronoodle/web exec playwright install --with-deps chromium
      - run: pnpm --filter @retronoodle/web exec playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
